<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — LivChat Agency India</title>
  <meta name="theme-color" content="#6C3CE1" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #6C3CE1;
      --accent: #EC4899;
      --dark: #0F0E17;
      --dark-2: #1A1830;
      --text: #E8E6F0;
      --text-muted: #9D9AB0;
    }
    body {
      background: var(--dark);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .icon-wrap {
      width: 96px; height: 96px;
      background: linear-gradient(135deg, #6C3CE1, #EC4899);
      border-radius: 24px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 28px;
      box-shadow: 0 12px 40px rgba(108,60,225,0.35);
    }
    .icon-wrap svg { width: 52px; height: 52px; fill: white; }
    h1 { font-size: 1.75rem; margin-bottom: 12px; }
    p {
      color: var(--text-muted);
      max-width: 320px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 14px 28px;
      background: linear-gradient(135deg, #6C3CE1, #EC4899);
      color: white; font-size: 1rem; font-weight: 600;
      border: none; border-radius: 50px; cursor: pointer;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.88; }
    .status {
      margin-top: 20px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .dot {
      display: inline-block; width: 8px; height: 8px;
      background: #EF4444; border-radius: 50%;
      margin-right: 6px; vertical-align: middle;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
</head>
<body>
  <div class="icon-wrap">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
      <path d="M1 6.5A2.5 2.5 0 013.5 4h17A2.5 2.5 0 0123 6.5v9A2.5 2.5 0 0120.5 18H15l-3 3-3-3H3.5A2.5 2.5 0 011 15.5v-9z"/>
    </svg>
  </div>
  <h1>You're Offline</h1>
  <p>No internet connection right now. Please check your network and try again.</p>
  <button class="btn" onclick="location.reload()">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.66 0 3-4.03 3-9s-1.34-9-3-9m0 18c-1.66 0-3-4.03-3-9s1.34-9 3-9"/>
    </svg>
    Try Again
  </button>
  <p class="status"><span class="dot"></span>Waiting for connection…</p>

  <script>
    window.addEventListener('online', () => location.reload());
  </script>
</body>
</html>
