<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif">
  <defs>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E11D48" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#E11D48" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A855F7" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B1230"/>
      <stop offset="1" stop-color="#160C14"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FB7185"/>
      <stop offset="1" stop-color="#BE185D"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A1A25"/>
      <stop offset="1" stop-color="#1C1219"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background glow -->
  <circle cx="200" cy="180" r="180" fill="url(#glowA)"/>
  <circle cx="460" cy="390" r="170" fill="url(#glowB)"/>

  <!-- Phone -->
  <g filter="url(#shadow)">
    <rect x="200" y="36" width="240" height="488" rx="38" fill="#1C1219" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>
    <rect x="212" y="48" width="216" height="464" rx="28" fill="url(#screen)"/>
    <rect x="290" y="58" width="60" height="8" rx="4" fill="#000" fill-opacity="0.5"/>
  </g>

  <!-- Profile -->
  <circle cx="320" cy="140" r="46" fill="url(#rose)"/>
  <circle cx="320" cy="126" r="16" fill="#fff" fill-opacity="0.92"/>
  <path d="M290 170a30 26 0 0 1 60 0z" fill="#fff" fill-opacity="0.92"/>
  <rect x="294" y="196" width="52" height="22" rx="11" fill="#E11D48"/>
  <circle cx="306" cy="207" r="3.5" fill="#fff"/>
  <text x="326" y="212" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">LIVE</text>
  <rect x="266" y="232" width="108" height="10" rx="5" fill="#fff" fill-opacity="0.75"/>
  <rect x="284" y="250" width="72" height="8" rx="4" fill="#fff" fill-opacity="0.35"/>

  <!-- Chat bubbles -->
  <rect x="228" y="282" width="128" height="40" rx="14" fill="#fff" fill-opacity="0.1"/>
  <rect x="242" y="294" width="84" height="7" rx="3.5" fill="#fff" fill-opacity="0.55"/>
  <rect x="242" y="307" width="56" height="7" rx="3.5" fill="#fff" fill-opacity="0.3"/>
  <rect x="284" y="334" width="128" height="40" rx="14" fill="url(#rose)"/>
  <rect x="298" y="346" width="92" height="7" rx="3.5" fill="#fff" fill-opacity="0.9"/>
  <rect x="298" y="359" width="60" height="7" rx="3.5" fill="#fff" fill-opacity="0.6"/>
  <rect x="228" y="386" width="110" height="40" rx="14" fill="#fff" fill-opacity="0.1"/>
  <rect x="242" y="398" width="70" height="7" rx="3.5" fill="#fff" fill-opacity="0.55"/>
  <rect x="242" y="411" width="44" height="7" rx="3.5" fill="#fff" fill-opacity="0.3"/>

  <!-- Bottom bar -->
  <rect x="228" y="452" width="132" height="36" rx="18" fill="#fff" fill-opacity="0.08"/>
  <circle cx="388" cy="470" r="18" fill="url(#rose)"/>
  <path d="M388 478l-7.5-7.2a4.6 4.6 0 0 1 7.5-5.4 4.6 4.6 0 0 1 7.5 5.4z" fill="#fff"/>

  <!-- Card: commission example -->
  <g filter="url(#shadow)">
    <rect x="22" y="300" width="236" height="122" rx="20" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.12"/>
  </g>
  <text x="42" y="330" font-size="13" font-weight="700" fill="#FB7185" letter-spacing="0.6">COMMISSION EXAMPLE</text>
  <text x="42" y="362" font-size="22" font-weight="700" fill="#EDE6EA">$1,000 × 10%</text>
  <text x="42" y="396" font-size="28" font-weight="800" fill="#ffffff">= $100</text>
  <rect x="160" y="378" width="80" height="22" rx="11" fill="#FBBF24" fill-opacity="0.16"/>
  <text x="200" y="393" font-size="11" font-weight="700" fill="#FBBF24" text-anchor="middle">Illustrative</text>

  <!-- Card: Beans example -->
  <g filter="url(#shadow)">
    <rect x="392" y="96" width="226" height="112" rx="20" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.12"/>
  </g>
  <circle cx="424" cy="132" r="14" fill="#FBBF24"/>
  <ellipse cx="424" cy="132" rx="5.5" ry="8" fill="#B45309" fill-opacity="0.55"/>
  <text x="446" y="137" font-size="13" font-weight="700" fill="#FBBF24" letter-spacing="0.6">BEANS EXAMPLE</text>
  <text x="412" y="172" font-size="20" font-weight="700" fill="#ffffff">100,000 → $10</text>
  <text x="412" y="194" font-size="12" fill="#B3A6AE">Historical ratio · verify current</text>

  <!-- Card: verify -->
  <g filter="url(#shadow)">
    <rect x="404" y="420" width="214" height="64" rx="18" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.12"/>
  </g>
  <circle cx="436" cy="452" r="15" fill="#10B981"/>
  <path d="M429 452.5l5 5 9-10" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="460" y="448" font-size="14" font-weight="700" fill="#ffffff">Verify first</text>
  <text x="460" y="466" font-size="12" fill="#B3A6AE">Use authorised channels</text>

  <!-- Sparkles -->
  <path d="M120 120l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#FBBF24" fill-opacity="0.9"/>
  <path d="M560 300l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#FB7185"/>
  <path d="M80 480l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#A855F7"/>
  <circle cx="540" cy="60" r="5" fill="#FB7185" fill-opacity="0.7"/>
  <circle cx="150" cy="240" r="4" fill="#A855F7" fill-opacity="0.8"/>
</svg>
